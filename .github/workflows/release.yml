# Publication d'une version : pousser une étiquette, par exemple
#   git tag v0.9.1 && git push origin v0.9.1
# → installeurs Windows (.msi, .exe, libVLC comprise) + APK Android TV et smartphone,
#   joints à une « Release » GitHub.
#
# APK signés si ces secrets existent (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64   (base64 -w0 souffly.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: libVLC embarquée
        shell: pwsh
        run: ./windows/prepare-vlc.ps1
      - name: Installeurs .msi et .exe
        shell: bash
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe
      - uses: actions/upload-artifact@v4
        with:
          name: soufflytv-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/souffly.jks"
            {
              echo "storeFile=$RUNNER_TEMP/souffly.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "APK signés"
          else
            echo "Pas de secrets de signature : APK non signés"
          fi
      - name: APK TV et smartphone
        run: ./gradlew :composeApp:releaseApks
      - uses: actions/upload-artifact@v4
        with:
          name: soufflytv-android
          path: composeApp/build/outputs/apk/*/release/*.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SoufflyTV ${{ github.ref_name }}
          files: dist/**/*
          generate_release_notes: true
