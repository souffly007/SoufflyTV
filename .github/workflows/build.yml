name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: soufflytv-android
          path: composeApp/build/outputs/apk/*/debug/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Outils de paquets Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Paquets natifs
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: soufflytv-${{ runner.os }}
          path: composeApp/build/compose/binaries/main/
